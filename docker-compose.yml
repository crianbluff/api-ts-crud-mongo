services:
  api-ts-container:
    container_name: api-ts-container
    image: api-ts-image
    build: .
    ports:
      - 3007:3007
    env_file:
      - .env
    networks:
      - api-ts-network
    depends_on:
      - db-api-ts-container

  db-api-ts-container:
    container_name: db-api-ts-container
    image: mongo:7.0-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
    - "27018:27017"
    volumes:
      - api-ts-mongo-data:/data/db
    networks:
      - api-ts-network

networks:
  api-ts-network:

volumes:
  api-ts-mongo-data: